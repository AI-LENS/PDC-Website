<app-page-hero heading="Gallery" subtitle="Moments from our sessions, meetups and hackathons." />

<section class="mx-auto max-w-7xl px-4 py-16 sm:px-6 lg:px-8">
  @for (album of albums; track album.title) {
    <div class="mb-14 last:mb-0">
      <div class="flex items-end justify-between gap-4">
        <div>
          <h2>{{ album.title }}</h2>
          <p class="mt-1 text-sm">{{ album.date }} &middot; {{ album.venue }}</p>
        </div>
        <span class="shrink-0 text-xs font-semibold uppercase tracking-wider text-ink-soft">
          {{ album.photos.length }} photos
        </span>
      </div>

      <div class="mt-6 grid grid-cols-2 gap-4 sm:grid-cols-3 lg:grid-cols-4">
        @for (photo of album.photos; track photo.src) {
          <figure class="overflow-hidden rounded-card border border-hairline bg-surface shadow-card">
            <img [src]="photo.src" [alt]="photo.alt"
                 [width]="photo.width" [height]="photo.height"
                 loading="lazy" decoding="async"
                 class="aspect-[4/3] w-full object-cover" />
            <figcaption class="px-3 py-2 text-xs text-ink-soft">{{ photo.caption }}</figcaption>
          </figure>
        }
      </div>
    </div>
  } @empty {
    <p class="text-sm text-ink-soft">Photos from our sessions will appear here.</p>
  }
</section>
