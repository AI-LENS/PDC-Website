<app-page-hero heading="Membership registration" subtitle="Join the PharmaDS Collective." />

<section class="mx-auto max-w-3xl px-4 py-16 sm:px-6 lg:px-8">
  <form class="space-y-8 rounded-band border border-hairline bg-surface-tint p-8"
        (submit)="$event.preventDefault()">

    @for (group of groups; track group.title) {
      <fieldset>
        <legend class="mb-4 text-lg font-bold text-brand-700">{{ group.title }}</legend>
        <div class="grid gap-5 sm:grid-cols-2">
          @for (field of group.fields; track field.name) {
            <label class="block" [class.sm:col-span-2]="field.wide">
              <span class="mb-1.5 block text-xs font-semibold uppercase tracking-wider text-ink-soft">{{ field.label }}</span>
              @if (field.type === 'select') {
                <select [name]="field.name"
                        class="w-full rounded-lg border border-hairline bg-surface px-4 py-2.5 text-sm
                               focus:border-teal-500 focus:outline-none">
                  <option value="">Select an option</option>
                </select>
              } @else if (field.type === 'textarea') {
                <textarea [name]="field.name" rows="3"
                          class="w-full rounded-lg border border-hairline bg-surface px-4 py-2.5 text-sm
                                 focus:border-teal-500 focus:outline-none"></textarea>
              } @else {
                <input [type]="field.type" [name]="field.name"
                       class="w-full rounded-lg border border-hairline bg-surface px-4 py-2.5 text-sm
                              focus:border-teal-500 focus:outline-none" />
              }
            </label>
          }
        </div>
      </fieldset>
    }

    <label class="flex items-start gap-2">
      <input type="checkbox" class="mt-1" />
      <span class="text-xs text-ink-soft">
        I accept the <a routerLink="/terms">terms and conditions</a> and the
        <a routerLink="/privacy">privacy policy</a>.
      </span>
    </label>

    <button type="submit"
            class="rounded-pill bg-brand-700 px-7 py-3 text-sm font-semibold text-white
                   transition-colors hover:bg-brand-800">Create account</button>
  </form>
</section>
