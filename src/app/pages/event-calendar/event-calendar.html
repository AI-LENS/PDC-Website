<app-page-hero heading="Events calendar" subtitle="Planned sessions for the year at a glance." />

<section class="mx-auto max-w-7xl px-4 py-16 sm:px-6 lg:px-8">
  <div class="overflow-x-auto rounded-card border border-hairline">
    <table class="w-full min-w-[46rem] border-collapse text-left text-sm">
      <thead class="bg-brand-700 text-white">
        <tr>
          @for (col of columns; track col) {
            <th scope="col" class="px-5 py-4 font-semibold">{{ col }}</th>
          }
        </tr>
      </thead>
      <tbody class="divide-y divide-hairline bg-surface">
        @for (row of rows; track $index) {
          <tr class="hover:bg-surface-tint">
            <td class="px-5 py-4 font-medium text-brand-700">{{ row.month }}</td>
            <td class="px-5 py-4">{{ row.title }}</td>
            <td class="px-5 py-4 text-ink-soft">{{ row.type }}</td>
            <td class="px-5 py-4 text-ink-soft">{{ row.venue }}</td>
            <td class="px-5 py-4">
              <span class="rounded-pill bg-teal-50 px-3 py-1 text-xs font-semibold text-teal-700">{{ row.status }}</span>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</section>
