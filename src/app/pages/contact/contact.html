<app-page-hero heading="Contact us" subtitle="Get in touch, become a member or share an idea." />

<section class="mx-auto max-w-7xl px-4 py-16 sm:px-6 lg:px-8">
  <div class="grid gap-10 lg:grid-cols-3">

    <div class="space-y-6">
      <div>
        <h2 class="text-2xl">Office address</h2>
        <address class="mt-3 text-sm not-italic leading-relaxed text-ink-soft">
          Address line one placeholder<br />
          Address line two placeholder<br />
          City, State — PIN
        </address>
      </div>

      <div>
        <h3 class="text-base">Email</h3>
        <p class="mt-1 text-sm">hello&#64;placeholder.org</p>
      </div>

      <div>
        <h3 class="text-base">Phone</h3>
        <p class="mt-1 text-sm">+00 00000 00000</p>
      </div>

      <div>
        <h3 class="text-base">Our location</h3>
        <div class="mt-3 flex aspect-video items-center justify-center rounded-card border border-hairline
                    bg-surface-tint text-xs text-ink-soft">
          Map placeholder
        </div>
      </div>
    </div>

    <form class="space-y-5 rounded-band border border-hairline bg-surface-tint p-8 lg:col-span-2"
          (submit)="$event.preventDefault()">
      <h2 class="text-2xl">Leave us a message</h2>

      <div class="grid gap-5 sm:grid-cols-2">
        @for (field of fields; track field.name) {
          <label class="block" [class.sm:col-span-2]="field.wide">
            <span class="mb-1.5 block text-xs font-semibold uppercase tracking-wider text-ink-soft">{{ field.label }}</span>
            @if (field.type === 'textarea') {
              <textarea [name]="field.name" rows="5"
                        class="w-full rounded-lg border border-hairline bg-surface px-4 py-2.5 text-sm
                               focus:border-teal-500 focus:outline-none"></textarea>
            } @else {
              <input [type]="field.type" [name]="field.name"
                     class="w-full rounded-lg border border-hairline bg-surface px-4 py-2.5 text-sm
                            focus:border-teal-500 focus:outline-none" />
            }
          </label>
        }
      </div>

      <button type="submit"
              class="rounded-pill bg-brand-700 px-7 py-3 text-sm font-semibold text-white
                     transition-colors hover:bg-brand-800">Send message</button>
    </form>
  </div>
</section>
