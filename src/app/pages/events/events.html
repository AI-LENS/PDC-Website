<app-page-hero heading="Upcoming events" subtitle="Sessions, meetups and hackathons from the collective." />

<section class="mx-auto max-w-7xl px-4 py-16 sm:px-6 lg:px-8">
  <h2>Event calendar {{ year }}</h2>

  <div class="mt-8 space-y-5">
    @for (event of events; track $index) {
      <article class="grid gap-6 rounded-card border border-hairline bg-surface p-6 shadow-card sm:grid-cols-[7rem_1fr_auto] sm:items-center">
        <div class="flex h-20 w-20 flex-col items-center justify-center rounded-card bg-brand-700 text-white">
          <span class="text-2xl font-bold leading-none">{{ event.day }}</span>
          <span class="mt-1 text-xs font-medium uppercase tracking-wider">{{ event.month }}</span>
        </div>

        <div>
          <h3>{{ event.title }}</h3>
          <p class="mt-1 text-sm">{{ event.description }}</p>
          <p class="mt-2 text-xs font-medium uppercase tracking-wider text-ink-soft">{{ event.venue }}</p>
        </div>

        <a routerLink="/events/1"
           class="shrink-0 rounded-pill bg-brand-700 px-6 py-3 text-center text-sm font-semibold text-white
                  transition-colors hover:bg-brand-800">Know more</a>
      </article>
    }
  </div>

  <div class="mt-10 flex flex-wrap gap-4">
    <a routerLink="/past-events" class="text-sm font-semibold text-link-600 hover:text-link-700">View past events</a>
    <a routerLink="/event-calendar" class="text-sm font-semibold text-link-600 hover:text-link-700">Full calendar</a>
  </div>
</section>
