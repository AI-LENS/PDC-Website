<app-page-hero heading="Frequently asked questions" subtitle="Answers to common questions about the collective." />

<section class="mx-auto max-w-4xl px-4 py-16 sm:px-6 lg:px-8">
  <div class="divide-y divide-hairline rounded-card border border-hairline bg-surface">
    @for (item of faqs; track $index) {
      <div>
        <button type="button" (click)="toggle($index)"
                [attr.aria-expanded]="isOpen($index)"
                class="flex w-full items-center justify-between gap-4 px-6 py-5 text-left">
          <span class="font-semibold text-brand-700">{{ item.question }}</span>
          <svg class="h-5 w-5 shrink-0 text-teal-600 transition-transform duration-200"
               [class.rotate-180]="isOpen($index)"
               viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 9l6 6 6-6" />
          </svg>
        </button>
        @if (isOpen($index)) {
          <div class="px-6 pb-5">
            <p class="text-sm">{{ item.answer }}</p>
          </div>
        }
      </div>
    }
  </div>
</section>
