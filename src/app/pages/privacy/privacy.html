<app-page-hero heading="Privacy policy" subtitle="How we handle your information." />

  <p class="text-xs uppercase tracking-wider text-ink-soft">Last updated: date placeholder</p>

  <div class="mt-8 space-y-10">

      </div>
    }
  </div>
